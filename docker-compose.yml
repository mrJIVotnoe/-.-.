version: '3.8'

services:
  # Main JIV Fleet Web & API Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiv-fleet-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - APP_URL=${APP_URL:-http://localhost:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://jiv_admin:jiv_fleet_secret_2026@db:5432/jiv_fleet_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CLOUD_PROVIDER=Bare-Metal / Self-Hosted
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jiv-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Local PostgreSQL Database for bare-metal self-hosting
  db:
    image: postgres:16-alpine
    container_name: jiv-fleet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jiv_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jiv_fleet_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-jiv_fleet_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - jiv-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jiv_admin} -d ${POSTGRES_DB:-jiv_fleet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Session Caching & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: jiv-fleet-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - jiv-network

  # Reverse Proxy & SSL Termination (Nginx)
  nginx:
    image: nginx:alpine
    container_name: jiv-fleet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - jiv-network

networks:
  jiv-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
